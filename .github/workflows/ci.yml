name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check public files for private paths
        run: |
          if grep -RInE '/Users/|/home/|192\.168\.|100\.[0-9]+\.' docs; then
            echo "Public site contains a machine-local path or address"
            exit 1
          fi
